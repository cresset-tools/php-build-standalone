# release-please keeps a long-lived release PR open against main. Every push
# to main updates that PR: it walks Conventional-Commits-tagged commits since
# the last release, bumps the version in .release-please-manifest.json, and
# regenerates CHANGELOG.md. Merging the PR creates the `vX.Y.Z` git tag and a
# GitHub Release.
#
# Pre-1.0 bump policy (see release-please-config.json):
#   - feat:  → patch  (bump-patch-for-minor-pre-major: true)
#   - fix:   → patch
#   - !/BREAKING CHANGE: → minor  (bump-minor-pre-major: true)
#   To force a 0.2.0, add a `Release-As: 0.2.0` footer to a commit on main.
#
# Tag triggers downstream:
#   build.yml's `publish` job fires on `refs/tags/v*`. For the tag created by
#   this workflow to trigger it, release-please must push with a token that
#   isn't the default GITHUB_TOKEN — GitHub deliberately blocks workflow
#   chaining when one workflow's GITHUB_TOKEN creates the trigger for another.
#   This workflow mints an installation token from the bot GitHub App
#   (secrets BOT_APP_ID + BOT_APP_PRIVATE_KEY, contents:write + PRs:write)
#   and passes it to release-please so the resulting tag fires build.yml.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
