# Weekly automated source bump. Runs scripts/update.py against the latest
# main, then scripts/auto-freeze-superseded.sh to snapshot prior PHP /
# service / extension versions into frozen/ from the live index. If
# anything changed, opens (or refreshes) a PR carrying both the bump
# and its frozen coverage. The PR then triggers build.yml on every
# minor × OS so the bumped sources.nix gets validated end-to-end before
# a human merges.
#
# Per-package vs single-PR: this workflow opens one PR per run aggregating
# every successful bump. Rationale — the bundled-deps build sequentially
# share /nix/store via FlakeHub Cache; isolating one bump per PR pays the
# full cache miss for unaffected deps every time. If a single bump is
# load-bearing (e.g. libxml2 breaks PHP 8.4), drop the offending file
# from the PR or open a follow-up that reverts that one entry.
#
# Authentication: an installation token minted from a GitHub App
# (secrets BOT_APP_ID + BOT_APP_PRIVATE_KEY) is used for both the
# per-package update scripts' api.github.com calls and the PR push.
# Unlike the default GITHUB_TOKEN, pushes authenticated as the app
# trigger downstream pull_request events, so build.yml runs on the
# automated PR.

name: update-sources

on:
  schedule:
    # Mondays 06:00 UTC. Far enough from the typical Friday-release
    # cadence of upstreams that the prior week's bumps have settled.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package list (e.g. 'zlib openssl'). Leave blank for all."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  # Required for determinate-nix-action to mint an OIDC token for
  # FlakeHub Cache. Without it the action prints "FlakeHub is disabled
  # because the workflow is misconfigured" and silently runs without
  # cache — the weekly bump then pays a full /nix/store miss.
  id-token: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Public index used by freeze-publish-entries.sh to snapshot the
      # superseded manifests. Mirrors build.yml's INDEX_HOST default so
      # the auto-freeze step talks to the same surface the bump will
      # eventually replace.
      INDEX_HOST: ${{ vars.INDEX_HOST || 'index.bougie.tools' }}
    steps:
      # Mint an installation token for the bot GitHub App. Used in
      # place of the workflow's GITHUB_TOKEN so that pushes to the PR
      # branch trigger build.yml (the default GITHUB_TOKEN is barred
      # from firing downstream workflows on its own pushes).
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # auto-freeze-superseded diffs shared/sources.nix against
      # origin/main, so we need that ref locally. fetch-depth: 0 keeps
      # things simple (full history) — the repo is small.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # nix is needed by scripts/update.py: it shells out to
      # `nix eval --json --file sources.nix` to read current values, and
      # `nix-prefetch-url` / `nix-hash` (called from update-lib.sh) to
      # produce sha256 digests in the same format fetchurl expects.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run update.py
        env:
          # Lifts the GitHub API rate limit for the per-package scripts
          # that hit api.github.com (zlib, openssl, libsodium, …).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${PACKAGES:-}" ]; then
            for p in $PACKAGES; do args+=("--package" "$p"); done
          fi
          scripts/update.py "${args[@]}"

      # Defensive: confirm sources.nix is still a valid Nix expression
      # before opening a PR. The orchestrator's regex rewriter is
      # constrained but a malformed update entry would manifest here
      # rather than as a build failure two hours later.
      - name: Verify sources.nix evaluates
        run: nix eval --json --file shared/sources.nix > /dev/null

      # Snapshot the about-to-be-superseded PHP / service / extension
      # versions into frozen/*.json so the PR ships its own frozen
      # coverage and the downstream lint-frozen-coverage gate stays
      # green. Idempotent on re-runs; a no-op when the only bumps are
      # bundled deps (auto-freeze only acts on artifacts that ship at
      # the index).
      - name: Freeze superseded versions
        env:
          PUBLISH_INDEX_BASE: https://${{ vars.INDEX_HOST || 'index.bougie.tools' }}
        run: scripts/auto-freeze-superseded.sh --against origin/main

      - name: Show diff
        run: git diff shared/sources.nix frozen/ || true

      - name: Open / refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # App-installation token (see "Mint app token" step). Required
          # so that the push to automated/update-sources triggers
          # pull_request events — the default GITHUB_TOKEN is barred
          # from firing downstream workflows on its own pushes, which
          # would silently skip build.yml on the PR.
          token: ${{ steps.app-token.outputs.token }}
          # Stable branch name: the action force-updates this branch on
          # subsequent runs, so a long-lived PR keeps moving forward
          # rather than the workflow opening a fresh PR every Monday.
          branch: automated/update-sources
          delete-branch: true
          base: main
          # Conventional Commits subject — release-please reads the merged
          # commit subject (squash merges) or this commit-message subject
          # (merge commits) to slot the bump into CHANGELOG.md's
          # "Dependencies" section.
          title: "deps: bump pinned upstreams (automated weekly)"
          commit-message: |
            deps: bump pinned upstreams via scripts/update.py

            Generated by .github/workflows/update-sources.yml. Each line
            in the shared/sources.nix diff corresponds to a per-package
            script under shared/update/. Any frozen/*.json changes are
            from scripts/auto-freeze-superseded.sh capturing the prior
            PHP / service / extension versions on the live index, so the
            PR satisfies lint-frozen-coverage on its own.
          body: |
            Automated source bump from `scripts/update.py`, with
            superseded PHP / service / extension versions captured into
            `frozen/` by `scripts/auto-freeze-superseded.sh`.

            Each entry in `shared/sources.nix` was produced by the matching
            script under `shared/update/`. Review the diff, let `build.yml`
            finish on this PR, and merge if green.

            If one entry breaks the build, drop the offending hunk and
            re-push — the rest of the PR can still land. The next weekly
            run will retry the dropped bump. If you drop a load-bearing
            bump (PHP, mariadb, redis, mkcert, or an extension series),
            also drop the matching `frozen/` change.
          labels: |
            automated
            sources
