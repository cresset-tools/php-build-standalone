# Weekly automated source bump. Runs scripts/update.py against the latest
# main, and if anything changed, opens (or refreshes) a PR. The PR then
# triggers build.yml on every minor × OS so the bumped sources.nix gets
# validated end-to-end before a human merges.
#
# Per-package vs single-PR: this workflow opens one PR per run aggregating
# every successful bump. Rationale — the bundled-deps build sequentially
# share /nix/store via FlakeHub Cache; isolating one bump per PR pays the
# full cache miss for unaffected deps every time. If a single bump is
# load-bearing (e.g. libxml2 breaks PHP 8.4), drop the offending file
# from the PR or open a follow-up that reverts that one entry.
#
# Authentication: the per-package update scripts use GITHUB_TOKEN for
# api.github.com calls (raises the unauth'd 60/hr rate limit to 1000/hr).
# peter-evans/create-pull-request needs the same token to push the
# branch. Both default to the workflow's automatic GITHUB_TOKEN.

name: update-sources

on:
  schedule:
    # Mondays 06:00 UTC. Far enough from the typical Friday-release
    # cadence of upstreams that the prior week's bumps have settled.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package list (e.g. 'zlib openssl'). Leave blank for all."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nix is needed by scripts/update.py: it shells out to
      # `nix eval --json --file sources.nix` to read current values, and
      # `nix-prefetch-url` / `nix-hash` (called from update-lib.sh) to
      # produce sha256 digests in the same format fetchurl expects.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run update.py
        env:
          # Lifts the GitHub API rate limit for the per-package scripts
          # that hit api.github.com (zlib, openssl, libsodium, …).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${PACKAGES:-}" ]; then
            for p in $PACKAGES; do args+=("--package" "$p"); done
          fi
          scripts/update.py "${args[@]}"

      # Defensive: confirm sources.nix is still a valid Nix expression
      # before opening a PR. The orchestrator's regex rewriter is
      # constrained but a malformed update entry would manifest here
      # rather than as a build failure two hours later.
      - name: Verify sources.nix evaluates
        run: nix eval --json --file php-unix/sources.nix > /dev/null

      - name: Show diff
        run: git diff php-unix/sources.nix || true

      - name: Open / refresh pull request
        uses: peter-evans/create-pull-request@v6
        with:
          # Stable branch name: the action force-updates this branch on
          # subsequent runs, so a long-lived PR keeps moving forward
          # rather than the workflow opening a fresh PR every Monday.
          branch: automated/update-sources
          delete-branch: true
          base: main
          title: "sources: automated weekly bump"
          commit-message: |
            sources: bump pinned upstreams via scripts/update.py

            Generated by .github/workflows/update-sources.yml. Each line
            in the diff corresponds to a per-package script under
            php-unix/update/.
          body: |
            Automated source bump from `scripts/update.py`.

            Each entry in the diff was produced by the matching script under
            `php-unix/update/`. Review the diff, let `build.yml` finish on
            this PR, and merge if green.

            If one entry breaks the build, drop the offending hunk and
            re-push — the rest of the PR can still land. The next weekly
            run will retry the dropped bump.
          labels: |
            automated
            sources
