# Build every supported PHP minor on push and PR. On version tags
# (refs/tags/v*), the publish job assembles and signs the full
# distribution tree and uploads it as a workflow artifact.
#
# Job graph:
#   build-tarball              — 5-minor × 2-OS matrix; per leg builds
#                                phpVariants.<system>.<minor>.{tarball,
#                                closures, extensions.xdebug, release}
#                                and uploads artifacts.
#   distro-matrix              — Ubuntu only; runs tests/run-matrix.sh for each
#                                PHP minor against 15 glibc distros + 1 musl
#                                expected-fail (Alpine).
#   assemble                   — 2-OS matrix (ubuntu-latest, macos-26); builds
#                                release-bundle and uploads it per platform.
#   verify-reproducible-index  — runs in parallel with assemble; builds
#                                release-bundle twice and byte-diffs the trees.
#   publish                    — tags only; downloads both release-bundle
#                                artifacts, merges them, validates the tree
#                                locally, signs the root with cosign keyless
#                                OIDC, and uploads the result as the
#                                `publish-tree` workflow artifact. A placeholder
#                                rsync step is present but disabled until the
#                                Hetzner box exists.
#
# URL substitution happens at index-generation time (inside index.nix), driven
# by INDEX_HOST/BLOB_HOST. Per-platform release-bundles are therefore host-
# specific by construction; both legs must share the same env so the merged
# tree is internally consistent.
#
# Every nontrivial shell script in this file is a thin `nix run .#<app>`
# call into scripts/*.sh. To reproduce the publish pipeline locally:
#
#   INDEX_HOST=index.bougie.tools BLOB_HOST=blobs.bougie.tools \
#     nix build .#release-bundle --impure
#   nix run .#merge-publish-tree        -- bundles/linux bundles/darwin .
#   VALIDATE_INDEX_SH=$PWD/tests/validate-index.sh \
#     nix run .#validate-publish-tree   -- merged
#   nix run .#sign-publish-index        -- index_tree
#
# The actual rsync to the Hetzner origin is deferred (placeholder step,
# currently disabled — see TODO(hetzner) in the publish job). Once
# provisioned, that step consumes the same `publish-tree` artifact shape.
#
# A full clean build of one minor takes ~15 minutes — most of that is the
# 17 C dependencies plus PHP itself plus xdebug. FlakeHub Cache shares
# /nix/store between matrix legs and between runs, so the bundled deps
# are built once and reused (PHP and xdebug are the only per-minor
# recompiles). Cache pushes authenticate via the workflow's GitHub OIDC
# token, which is why jobs need `id-token: write`. PR pushes from forks
# lack the required JWT claims; FlakeHub Cache silently downgrades to
# read-only on those.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded pushes on PR branches. Never cancel main — a tag push
# mid-release would otherwise leave a half-uploaded GH Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Hosts the index will be served from. These propagate into nix builds via
# `--impure` so index.nix can bake real URLs into the bundle at generation
# time (no post-build sed pass — the section sha256s in the root must match
# served bytes). Both `assemble` legs and `verify-reproducible-index` need
# the same values for the merge to be internally consistent.
env:
  # Public hostnames the index bakes in. Clients fetch from these. May
  # be CDN-fronted (index.bougie.tools is on Cloudflare).
  INDEX_HOST: ${{ vars.INDEX_HOST || 'index.bougie.tools' }}
  BLOB_HOST:  ${{ vars.BLOB_HOST  || 'blobs.bougie.tools' }}
  # SSH destination for the rsync push. Has to resolve directly to the
  # box because Cloudflare doesn't proxy SSH; INDEX_HOST in particular
  # may be orange-cloud and refuse the connection. Defaults to the
  # grey-cloud A/AAAA at origin.bougie.tools.
  SSH_HOST: ${{ vars.SSH_HOST || 'origin.bougie.tools' }}
  # PUBLISH_VERSION names the immutable per-publish snapshot folder
  # (DISTRIBUTION.md §Snapshot-consistency). github.run_id is a stable
  # integer per workflow run — same value across all jobs and matrix
  # legs, so every bundle bakes in the same version and
  # merge-publish-tree can assert version-equality. Using run_id
  # (instead of github.run_started_at) because the run_started_at
  # context is not populated at workflow-level env evaluation time
  # — it returns "" and the nix build falls through to the sentinel
  # default.
  PUBLISH_VERSION: r${{ github.run_id }}
  # GIT_COMMIT / GIT_REF surface in index.json `source` for audit.
  GIT_COMMIT: ${{ github.sha }}
  GIT_REF:    ${{ github.ref }}

jobs:
  lint-frozen-coverage:
    name: lint frozen coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run lint
        run: nix run .#lint-frozen-coverage

  build-tarball:
    name: build PHP ${{ matrix.php }} ${{ matrix.flavor }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # Don't cancel the other minors when one fails — we want to know
      # which version-specific patches need attention, not just the first.
      fail-fast: false
      matrix:
        # Each row carries:
        #   - php / minor: dotted version + underscored flake attribute suffix
        #     (Nix CLI parses dots as attribute path separators, so the
        #     phpVariants schema keys minors as `8_5`, not 8.5).
        #   - flavor: "nts" or "zts". The flake's phpVariants attribute uses
        #     the bare minor key for NTS (`8_5`) and a "_zts" suffix for ZTS
        #     (`8_5_zts`); variant_key below assembles it. The flavor token
        #     also lands in the tarball filename / manifest tag via
        #     tarball.nix.
        #   - variant_key: minor + "_zts" for ZTS, just minor for NTS. Used
        #     to address phpVariants outputs.
        #   - os: GitHub-hosted runner image. ubuntu-latest covers x86_64
        #     glibc; macos-26 (Tahoe) is the current Apple Silicon image
        #     (only macOS arch we ship — Apple dropped x86_64 in macOS 27).
        #   - system: Nix system tuple used to address phpVariants outputs
        #     (`phpVariants.<system>.<variant_key>.<artifact>`).
        #   - target: triple used in the tarball filename. Matches the
        #     value baked into the .json metadata by tarball.nix.
        include:
          - { php: "8.1", minor: "8_1", flavor: "nts", variant_key: "8_1",     os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.2", minor: "8_2", flavor: "nts", variant_key: "8_2",     os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.3", minor: "8_3", flavor: "nts", variant_key: "8_3",     os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.4", minor: "8_4", flavor: "nts", variant_key: "8_4",     os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.5", minor: "8_5", flavor: "nts", variant_key: "8_5",     os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.1", minor: "8_1", flavor: "zts", variant_key: "8_1_zts", os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.2", minor: "8_2", flavor: "zts", variant_key: "8_2_zts", os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.3", minor: "8_3", flavor: "zts", variant_key: "8_3_zts", os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.4", minor: "8_4", flavor: "zts", variant_key: "8_4_zts", os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.5", minor: "8_5", flavor: "zts", variant_key: "8_5_zts", os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { php: "8.1", minor: "8_1", flavor: "nts", variant_key: "8_1",     os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.2", minor: "8_2", flavor: "nts", variant_key: "8_2",     os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.3", minor: "8_3", flavor: "nts", variant_key: "8_3",     os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.4", minor: "8_4", flavor: "nts", variant_key: "8_4",     os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.5", minor: "8_5", flavor: "nts", variant_key: "8_5",     os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.1", minor: "8_1", flavor: "zts", variant_key: "8_1_zts", os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.2", minor: "8_2", flavor: "zts", variant_key: "8_2_zts", os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.3", minor: "8_3", flavor: "zts", variant_key: "8_3_zts", os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.4", minor: "8_4", flavor: "zts", variant_key: "8_4_zts", os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          - { php: "8.5", minor: "8_5", flavor: "zts", variant_key: "8_5_zts", os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
          # musl leg: built on the glibc ubuntu runner (the toolchain
          # cross-targets musl via pkgsMusl; see shared/toolchain-musl.nix),
          # addressed through the `x86_64-linux-musl` flake leg key. The
          # musl artifacts can't run on the glibc runner, so the smoke-test
          # step below runs them in an Alpine container instead.
          - { php: "8.1", minor: "8_1", flavor: "nts", variant_key: "8_1",     os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.2", minor: "8_2", flavor: "nts", variant_key: "8_2",     os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.3", minor: "8_3", flavor: "nts", variant_key: "8_3",     os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.4", minor: "8_4", flavor: "nts", variant_key: "8_4",     os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.5", minor: "8_5", flavor: "nts", variant_key: "8_5",     os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.1", minor: "8_1", flavor: "zts", variant_key: "8_1_zts", os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.2", minor: "8_2", flavor: "zts", variant_key: "8_2_zts", os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.3", minor: "8_3", flavor: "zts", variant_key: "8_3_zts", os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.4", minor: "8_4", flavor: "zts", variant_key: "8_4_zts", os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
          - { php: "8.5", minor: "8_5", flavor: "zts", variant_key: "8_5_zts", os: ubuntu-latest, system: "x86_64-linux-musl", target: "x86_64-unknown-linux-musl" }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.2

      - name: Build tarball
        # Each nix build uses its own -o symlink so subsequent builds
        # don't clobber prior results — the upload steps below need
        # both the interpreter tarball and the release tree to coexist.
        run: nix build ".#phpVariants.${{ matrix.system }}.${{ matrix.variant_key }}.tarball" -o result-tarball --print-build-logs

      - name: Smoke-test the artifact
        # Extract to a fresh prefix and verify the basics: PHP runs, the
        # expected version is reported, intl resolves locale data through
        # the bundled ICU, and runtime path resolution tracks the install
        # root after the tree is moved. xdebug is NOT checked here —
        # Phase 3 ships xdebug as a separate per-extension tarball; the
        # distro-matrix job covers xdebug end-to-end via tests/smoke.sh.
        # These gates are version- and platform-agnostic; one script
        # handles both Linux-glibc and Darwin matrix legs (same tarball
        # layout, same relocation contract — pbs_relocate.h switches on
        # __APPLE__). The musl leg runs on a glibc runner that can't exec a
        # musl binary, so it's smoke-tested in an Alpine container below.
        if: ${{ matrix.target != 'x86_64-unknown-linux-musl' }}
        run: nix run .#smoke-test-tarball -- "$(ls result-tarball/php-*.tar.zst | head -1)" "${{ matrix.php }}"

      - name: Smoke-test the artifact (musl / Alpine)
        # The musl tarball targets /lib/ld-musl-x86_64.so.1, which the glibc
        # ubuntu runner lacks. Extract + run it on real Alpine musl instead:
        # confirm PHP runs, reports the expected version, and loads a
        # bundled-C-lib extension (openssl) through the $ORIGIN store RPATHs.
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          tarball="$(ls result-tarball/php-*.tar.zst | head -1)"
          docker run --rm --platform linux/amd64 \
            -v "$PWD/$tarball":/php.tar.zst:ro \
            -e EXPECT_VER="${{ matrix.php }}" \
            alpine:3.22 sh -euc '
              apk add --no-cache zstd tar >/dev/null
              mkdir /opt/php && tar -C /opt/php -xf /php.tar.zst
              php="$(find /opt/php -name php -path "*/bin/*" -type f | head -1)"
              "$php" --version
              "$php" --version | head -1 | grep -q "PHP $EXPECT_VER" \
                || { echo "FATAL: version mismatch (expected $EXPECT_VER)" >&2; exit 1; }
              "$php" -r "exit(extension_loaded(\"openssl\") ? 0 : 1);" \
                || { echo "FATAL: openssl extension not loaded" >&2; exit 1; }
              echo "Alpine musl smoke OK"
            '

      - name: Build closures
        run: nix build ".#phpVariants.${{ matrix.system }}.${{ matrix.variant_key }}.closures" -o result-closures --print-build-logs

      - name: Build extension-xdebug
        run: nix build ".#phpVariants.${{ matrix.system }}.${{ matrix.variant_key }}.extensions.xdebug" -o result-extension --print-build-logs

      - name: Build release
        run: nix build ".#phpVariants.${{ matrix.system }}.${{ matrix.variant_key }}.release" -o result-release --print-build-logs

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # Per-(minor × flavor × target) name so the matrix legs don't collide.
          name: php-tarball-${{ matrix.php }}-${{ matrix.flavor }}-${{ matrix.target }}
          path: |
            result-tarball/php-*.tar.zst
            result-tarball/php-*.json
          if-no-files-found: error

      - name: Upload release tree as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # Uploaded separately from the tarball so the assemble job can
          # grab all minor × flavor release trees without needing the raw
          # interpreter tarballs again.
          name: release-${{ matrix.php }}-${{ matrix.flavor }}-${{ matrix.target }}
          path: result-release/
          if-no-files-found: error

  build-mariadb:
    name: build MariaDB (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # MariaDB ships as a single version per build (sources.mariadb is
      # flat — no PHP-style minor fan-out yet), so the matrix is just one
      # row per supported OS. A version-fan-out tier would slot in here
      # alongside the os/system/target columns the day sources.mariadb
      # becomes a per-version map.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.2

      - name: Build mariadb tarball
        # mariadb-tarball is the redistributable artifact; mariadb-release is
        # the flat-dir aggregate the index assembly stage consumes. Build
        # both with separate -o symlinks so the upload steps can address
        # each independently without re-resolving the derivations.
        run: nix build .#packages.${{ matrix.system }}.mariadb-tarball -o result-mariadb-tarball --print-build-logs

      - name: Build mariadb release
        run: nix build .#packages.${{ matrix.system }}.mariadb-release -o result-mariadb-release --print-build-logs

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mariadb-tarball-${{ matrix.target }}
          path: |
            result-mariadb-tarball/mariadb-*.tar.zst
            result-mariadb-tarball/mariadb-*.json
          if-no-files-found: error

      - name: Upload release tree as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # Mirrors the PHP release-<minor>-<target> shape so the
          # assemble job's release-bundle can pick up the MariaDB tree
          # by name once we wire MariaDB into the global index build.
          name: mariadb-release-${{ matrix.target }}
          path: result-mariadb-release/
          if-no-files-found: error

  build-redis:
    name: build Redis (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # Redis ships as a single version per build (sources.redis is flat,
      # same shape as sources.mariadb). One row per supported OS. A
      # version-fan-out tier would slot in here the day sources.redis
      # becomes a per-version map.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.2

      - name: Build redis tarball
        # redis-tarball is the redistributable artifact; redis-release is
        # the flat-dir aggregate the index assembly stage consumes. Build
        # both with separate -o symlinks so the upload steps can address
        # each independently without re-resolving the derivations.
        run: nix build .#packages.${{ matrix.system }}.redis-tarball -o result-redis-tarball --print-build-logs

      - name: Build redis release
        run: nix build .#packages.${{ matrix.system }}.redis-release -o result-redis-release --print-build-logs

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: redis-tarball-${{ matrix.target }}
          path: |
            result-redis-tarball/redis-*.tar.zst
            result-redis-tarball/redis-*.json
          if-no-files-found: error

      - name: Upload release tree as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          # Mirrors the MariaDB release-<target> shape so the assemble
          # job's release-bundle can pick up the Redis tree by name.
          name: redis-release-${{ matrix.target }}
          path: result-redis-release/
          if-no-files-found: error

  build-erlang:
    name: build Erlang (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # Erlang/OTP ships as a single version per build (sources.erlang is
      # flat — RabbitMQ's compatibility matrix narrows enough that we're
      # not pinning multiple OTP minors in parallel). One row per
      # supported OS, matching the mariadb/redis shape.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: "x86_64-linux",   target: "x86_64-unknown-linux-gnu" }
          - { os: macos-26,      system: "aarch64-darwin", target: "aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.2

      - name: Build erlang tarball
        # erlang-tarball is the redistributable artifact; erlang-release
        # is the flat-dir aggregate the index assembly stage consumes.
        # Same -o-symlink split mariadb/redis use.
        run: nix build .#packages.${{ matrix.system }}.erlang-tarball -o result-erlang-tarball --print-build-logs

      - name: Build erlang release
        run: nix build .#packages.${{ matrix.system }}.erlang-release -o result-erlang-release --print-build-logs

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: erlang-tarball-${{ matrix.target }}
          path: |
            result-erlang-tarball/erlang-*.tar.zst
            result-erlang-tarball/erlang-*.json
          if-no-files-found: error

      - name: Upload release tree as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: erlang-release-${{ matrix.target }}
          path: result-erlang-release/
          if-no-files-found: error

  # NOTE: no dedicated build-rabbitmq job. RabbitMQ is a pure repackage
  # (fetchurl + tar extract + inject the finalized erlang tree + tar
  # create), no compilation involved — the assemble job picks it up
  # cheaply via release-bundle once build-erlang has warmed the
  # erlangTree cache. Same precedent as tools/jdk/ and tools/opensearch/
  # which are also pure repackages and don't have dedicated jobs.

  distro-matrix:
    name: distro matrix PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux tarball
        # NTS only — the distro-matrix gate validates the build against
        # the supported glibc range, which is flavor-agnostic. ZTS rides
        # on the same dynamic-linker contract and adds no new portability
        # surface, so we don't double this job.
        uses: actions/download-artifact@v8
        with:
          name: php-tarball-${{ matrix.php }}-nts-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Run distro matrix
        run: |
          tarball=$(find artifacts -name 'php-*.tar.zst' | head -n1)
          PHP_TARBALL="$tarball" tests/run-matrix.sh

  assemble:
    name: assemble release-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # release-bundle's allReleases includes mariadbRelease,
    # redisServerRelease, and erlangRelease — each of those is an
    # actual compile, so they need their dedicated build job to have
    # warmed the cache before assemble runs. rabbitmq/jdk/mkcert/
    # opensearch are pure repackages assemble picks up cheaply
    # without a dedicated job.
    needs: [build-tarball, build-mariadb, build-redis, build-erlang]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The musl leg assembles its own release-bundle on the same ubuntu
        # runner (separate flake output `release-bundle-musl`), merged into
        # the unified tree alongside linux-glibc + darwin in `publish`.
        include:
          - { os: ubuntu-latest, artifact: linux,  bundle_attr: "release-bundle" }
          - { os: ubuntu-latest, artifact: musl,   bundle_attr: "release-bundle-musl" }
          - { os: macos-26,      artifact: darwin, bundle_attr: "release-bundle" }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.2

      - name: Build release-bundle
        # FlakeHub Cache hits all per-minor inputs already built in
        # build-tarball, so this is fast on a warm cache.
        # --impure lets index.nix read INDEX_HOST/BLOB_HOST via getEnv.
        # All legs see the workflow-level env, so the merged tree
        # is internally consistent.
        run: nix build ".#${{ matrix.bundle_attr }}" --impure --print-build-logs

      - name: Upload release-bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ matrix.artifact }}
          path: result/
          if-no-files-found: error

  # Phase 9 — Reproducibility audit.
  # Runs in parallel with assemble (needs only build-tarball). Builds
  # release-bundle twice using --rebuild so Nix re-derives the same
  # derivation and rejects it if the output bytes differ. The diff is a
  # belt-and-braces check on top of Nix's content-addressed store.
  verify-reproducible-index:
    name: reproducibility audit
    runs-on: ubuntu-latest
    needs: [build-tarball, build-mariadb, build-redis, build-erlang]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.2

      - name: Build release-bundle (first pass)
        run: nix build .#release-bundle --impure -o result-1 --print-build-logs

      - name: Build release-bundle (second pass — --rebuild)
        # --rebuild re-derives the derivation from scratch. Nix checks that
        # the new output is content-equal to the already-stored one; if not,
        # it fails here with "hash mismatch in fixed-output derivation".
        # --impure picks up the workflow-level INDEX_HOST/BLOB_HOST env
        # (same values both passes, so the bytes match).
        run: nix build .#release-bundle --impure --rebuild -o result-2 --print-build-logs

      - name: Byte-diff the two outputs
        run: diff -r result-1/ result-2/

  # Phase 5 + 7 — Root signing and publish tree preparation.
  #
  # Merges the Linux and Darwin release-bundle trees into one unified
  # distribution tree, then:
  #   1. Validates the tree locally against a localhost http.server so the
  #      sha256 chain is verified end-to-end. Bundles are already host-baked
  #      (substitution happens in index.nix), so no further URL rewrite is
  #      needed before signing.
  #   2. Signs index.json with cosign keyless (Sigstore OIDC), producing
  #      index.json.sig as a Sigstore bundle file.
  #   3. Uploads the final tree as the `publish-tree` workflow artifact.
  #   4. Rsyncs to the Hetzner origin.
  publish:
    name: prepare publish tree
    runs-on: ubuntu-latest
    needs: [build-tarball, build-mariadb, build-redis, build-erlang, distro-matrix, assemble]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read   # no Pages/Releases push
      id-token: write  # cosign keyless OIDC
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Download Linux release-bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-linux
          path: bundles/linux/

      - name: Download Linux musl release-bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-musl
          path: bundles/musl/

      - name: Download Darwin release-bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-darwin
          path: bundles/darwin/

      - name: Merge per-leg trees
        # Each leg's bundle shares the same index.json schema (generated is
        # the reproducible per-leg sentinel) but has a disjoint
        # targets/<triple> subtree. The merge unions versions/ and blobs/,
        # deep-merges the index.json .targets maps, stamps `generated` with
        # wall-clock-now, then splits into merged/ and index_tree/ (the
        # latter excludes blobs/, ready for signing).
        run: nix run .#merge-publish-tree -- bundles/linux bundles/musl bundles/darwin .

      - name: Validate tree locally
        # Each leg's release-bundle was built with the workflow-level
        # INDEX_HOST/BLOB_HOST baked in, so the merged tree's section
        # sha256s already match the served bytes. validate-index.sh
        # walks the full hash chain (root → section → manifest → blob).
        # merged/ is served so manifest relative URLs and blob paths
        # resolve locally; absolute manifest blob URLs point at the
        # configured BLOB_HOST and only get HEAD-checked if reachable.
        run: VALIDATE_INDEX_SH=$PWD/tests/validate-index.sh nix run .#validate-publish-tree -- merged

      - name: Sign index.json (cosign keyless via OIDC)
        # Produces a Sigstore bundle (index.json.sig) alongside index.json.
        # The bundle contains the signature, signing certificate, and Rekor
        # transparency log inclusion proof. The signed bytes are the final
        # bytes — no post-build rewrites between here and rsync.
        run: nix run .#sign-publish-index -- index_tree

      - name: Upload publish-tree artifact
        # Packages both the signed index tree and the blob tree for inspection
        # and future rsync consumption. The artifact mirrors the on-disk layout
        # that the rsync step (below) would push to the origin.
        uses: actions/upload-artifact@v7
        with:
          name: publish-tree
          path: |
            index_tree/
            merged/blobs/
          if-no-files-found: error

      # Push the prepared tree to the cresset-tools/infra origin (CAX11 +
      # Cloud Volume). Three passes per scripts/rsync-publish-tree.sh:
      # blobs first (additive, content-addressed), then the new index
      # tree to /srv/index-versions/<VERSION>/, then atomic symlink flip
      # of /srv/index. Observers never see a half-applied state.
      - name: Rsync to origin
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
        run: nix run .#rsync-publish-tree -- index_tree merged/blobs "$SSH_HOST"
