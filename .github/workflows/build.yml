# Build every supported PHP minor on push and PR. On version tags
# (refs/tags/v*), the publish job assembles and signs the full
# distribution tree and uploads it as a workflow artifact.
#
# Job graph:
#   build-tarball              — 5-minor × 2-OS matrix; builds tarball-<minor>,
#                                closures-<minor>, extension-xdebug-<minor>,
#                                release-<minor> per leg; uploads artifacts.
#   distro-matrix              — Ubuntu only; runs tests/run-matrix.sh for each
#                                PHP minor against 15 glibc distros + 1 musl
#                                expected-fail (Alpine).
#   assemble                   — 2-OS matrix (ubuntu-latest, macos-26); builds
#                                release-bundle and uploads it per platform.
#   verify-reproducible-index  — runs in parallel with assemble; builds
#                                release-bundle twice and byte-diffs the trees.
#   publish                    — tags only; downloads both release-bundle
#                                artifacts, merges them, validates the tree
#                                locally, signs the root with cosign keyless
#                                OIDC, and uploads the result as the
#                                `publish-tree` workflow artifact. A placeholder
#                                rsync step is present but disabled until the
#                                Hetzner box exists.
#
# URL substitution happens at index-generation time (inside index.nix), driven
# by INDEX_HOST/BLOB_HOST. Per-platform release-bundles are therefore host-
# specific by construction; both legs must share the same env so the merged
# tree is internally consistent.
#
# Every nontrivial shell script in this file is a thin `nix run .#<app>`
# call into scripts/*.sh. To reproduce the publish pipeline locally:
#
#   INDEX_HOST=index.bougie.tools BLOB_HOST=blobs.bougie.tools \
#     nix build .#release-bundle --impure
#   nix run .#merge-publish-tree        -- bundles/linux bundles/darwin .
#   VALIDATE_INDEX_SH=$PWD/tests/validate-index.sh \
#     nix run .#validate-publish-tree   -- merged
#   nix run .#sign-publish-index        -- index_tree
#
# The actual rsync to the Hetzner origin is deferred (placeholder step,
# currently disabled — see TODO(hetzner) in the publish job). Once
# provisioned, that step consumes the same `publish-tree` artifact shape.
#
# A full clean build of one minor takes ~15 minutes — most of that is the
# 17 C dependencies plus PHP itself plus xdebug. FlakeHub Cache shares
# /nix/store between matrix legs and between runs, so the bundled deps
# are built once and reused (PHP and xdebug are the only per-minor
# recompiles). Cache pushes authenticate via the workflow's GitHub OIDC
# token, which is why jobs need `id-token: write`. PR pushes from forks
# lack the required JWT claims; FlakeHub Cache silently downgrades to
# read-only on those.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded pushes on PR branches. Never cancel main — a tag push
# mid-release would otherwise leave a half-uploaded GH Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Hosts the index will be served from. These propagate into nix builds via
# `--impure` so index.nix can bake real URLs into the bundle at generation
# time (no post-build sed pass — the section sha256s in the root must match
# served bytes). Both `assemble` legs and `verify-reproducible-index` need
# the same values for the merge to be internally consistent.
env:
  # Public hostnames the index bakes in. Clients fetch from these. May
  # be CDN-fronted (index.bougie.tools is on Cloudflare).
  INDEX_HOST: ${{ vars.INDEX_HOST || 'index.bougie.tools' }}
  BLOB_HOST:  ${{ vars.BLOB_HOST  || 'blobs.bougie.tools' }}
  # SSH destination for the rsync push. Has to resolve directly to the
  # box because Cloudflare doesn't proxy SSH; INDEX_HOST in particular
  # may be orange-cloud and refuse the connection. Defaults to the
  # grey-cloud A/AAAA at origin.bougie.tools.
  SSH_HOST: ${{ vars.SSH_HOST || 'origin.bougie.tools' }}
  # PUBLISH_VERSION names the immutable per-publish snapshot folder
  # (DISTRIBUTION.md §Snapshot-consistency). github.run_id is a stable
  # integer per workflow run — same value across all jobs and matrix
  # legs, so every bundle bakes in the same version and
  # merge-publish-tree can assert version-equality. Using run_id
  # (instead of github.run_started_at) because the run_started_at
  # context is not populated at workflow-level env evaluation time
  # — it returns "" and the nix build falls through to the sentinel
  # default.
  PUBLISH_VERSION: r${{ github.run_id }}
  # GIT_COMMIT / GIT_REF surface in index.json `source` for audit.
  GIT_COMMIT: ${{ github.sha }}
  GIT_REF:    ${{ github.ref }}

jobs:
  lint-frozen-coverage:
    name: lint frozen coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run lint
        run: nix run .#lint-frozen-coverage

  build-tarball:
    name: build PHP ${{ matrix.php }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # Don't cancel the other minors when one fails — we want to know
      # which version-specific patches need attention, not just the first.
      fail-fast: false
      matrix:
        # Each row carries:
        #   - php / minor: dotted version + underscored flake attribute suffix
        #     (Nix CLI parses dots as attribute path separators, so the
        #     flake exposes `tarball-8_5`, not 8.5).
        #   - os: GitHub-hosted runner image. ubuntu-latest covers x86_64
        #     glibc; macos-26 (Tahoe) is the current Apple Silicon image
        #     (only macOS arch we ship — Apple dropped x86_64 in macOS 27).
        #   - target: triple used in the tarball filename. Matches the
        #     value baked into the .json metadata by tarball.nix.
        include:
          - { php: "8.1", minor: "8_1", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.2", minor: "8_2", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.3", minor: "8_3", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.4", minor: "8_4", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.5", minor: "8_5", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.1", minor: "8_1", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.2", minor: "8_2", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.3", minor: "8_3", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.4", minor: "8_4", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.5", minor: "8_5", os: macos-26,      target: "aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build tarball
        # Each nix build uses its own -o symlink so subsequent builds
        # don't clobber prior results — the upload steps below need
        # both the interpreter tarball and the release tree to coexist.
        run: nix build ".#tarball-${{ matrix.minor }}" -o result-tarball --print-build-logs

      - name: Smoke-test the artifact
        # Extract to a fresh prefix and verify the basics: PHP runs, the
        # expected version is reported, intl resolves locale data through
        # the bundled ICU, and runtime path resolution tracks the install
        # root after the tree is moved. xdebug is NOT checked here —
        # Phase 3 ships xdebug as a separate per-extension tarball; the
        # distro-matrix job covers xdebug end-to-end via tests/smoke.sh.
        # These gates are version- and platform-agnostic; one script
        # handles both Linux and Darwin matrix legs (same tarball layout,
        # same relocation contract — pbs_relocate.h switches on __APPLE__).
        run: nix run .#smoke-test-tarball -- "$(ls result-tarball/php-*.tar.zst | head -1)" "${{ matrix.php }}"

      - name: Build closures
        run: nix build ".#closures-${{ matrix.minor }}" -o result-closures --print-build-logs

      - name: Build extension-xdebug
        run: nix build ".#extension-xdebug-${{ matrix.minor }}" -o result-extension --print-build-logs

      - name: Build release
        run: nix build ".#release-${{ matrix.minor }}" -o result-release --print-build-logs

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Per-(minor × target) name so the matrix legs don't collide.
          name: php-tarball-${{ matrix.php }}-${{ matrix.target }}
          path: |
            result-tarball/php-*.tar.zst
            result-tarball/php-*.json
          if-no-files-found: error

      - name: Upload release tree as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Uploaded separately from the tarball so the assemble job can
          # grab all five minors' release trees without needing the raw
          # interpreter tarballs again.
          name: release-${{ matrix.php }}-${{ matrix.target }}
          path: result-release/
          if-no-files-found: error

  distro-matrix:
    name: distro matrix PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: php-tarball-${{ matrix.php }}-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Run distro matrix
        run: |
          tarball=$(find artifacts -name 'php-*.tar.zst' | head -n1)
          PHP_TARBALL="$tarball" tests/run-matrix.sh

  assemble:
    name: assemble release-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: linux }
          - { os: macos-26,      artifact: darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build release-bundle
        # FlakeHub Cache hits all per-minor inputs already built in
        # build-tarball, so this is fast on a warm cache.
        # --impure lets index.nix read INDEX_HOST/BLOB_HOST via getEnv.
        # Both matrix legs see the workflow-level env, so the merged tree
        # is internally consistent.
        run: nix build .#release-bundle --impure --print-build-logs

      - name: Upload release-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.artifact }}
          path: result/
          if-no-files-found: error

  # Phase 9 — Reproducibility audit.
  # Runs in parallel with assemble (needs only build-tarball). Builds
  # release-bundle twice using --rebuild so Nix re-derives the same
  # derivation and rejects it if the output bytes differ. The diff is a
  # belt-and-braces check on top of Nix's content-addressed store.
  verify-reproducible-index:
    name: reproducibility audit
    runs-on: ubuntu-latest
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build release-bundle (first pass)
        run: nix build .#release-bundle --impure -o result-1 --print-build-logs

      - name: Build release-bundle (second pass — --rebuild)
        # --rebuild re-derives the derivation from scratch. Nix checks that
        # the new output is content-equal to the already-stored one; if not,
        # it fails here with "hash mismatch in fixed-output derivation".
        # --impure picks up the workflow-level INDEX_HOST/BLOB_HOST env
        # (same values both passes, so the bytes match).
        run: nix build .#release-bundle --impure --rebuild -o result-2 --print-build-logs

      - name: Byte-diff the two outputs
        run: diff -r result-1/ result-2/

  # Phase 5 + 7 — Root signing and publish tree preparation.
  #
  # Merges the Linux and Darwin release-bundle trees into one unified
  # distribution tree, then:
  #   1. Validates the tree locally against a localhost http.server so the
  #      sha256 chain is verified end-to-end. Bundles are already host-baked
  #      (substitution happens in index.nix), so no further URL rewrite is
  #      needed before signing.
  #   2. Signs index.json with cosign keyless (Sigstore OIDC), producing
  #      index.json.sig as a Sigstore bundle file.
  #   3. Uploads the final tree as the `publish-tree` workflow artifact.
  #   4. Rsyncs to the Hetzner origin.
  publish:
    name: prepare publish tree
    runs-on: ubuntu-latest
    needs: [build-tarball, distro-matrix, assemble]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read   # no Pages/Releases push
      id-token: write  # cosign keyless OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Download Linux release-bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-linux
          path: bundles/linux/

      - name: Download Darwin release-bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-darwin
          path: bundles/darwin/

      - name: Merge Linux + Darwin trees
        # Both bundles share the same index.json schema and generated timestamp
        # (SOURCE_DATE_EPOCH is fixed in index.nix) but have disjoint
        # targets/<triple> subtrees. The merge unions targets/ and blobs/,
        # deep-merges the two index.json roots, then splits into merged/ and
        # index_tree/ (the latter excludes blobs/, ready for signing).
        run: nix run .#merge-publish-tree -- bundles/linux bundles/darwin .

      - name: Validate tree locally
        # Each leg's release-bundle was built with the workflow-level
        # INDEX_HOST/BLOB_HOST baked in, so the merged tree's section
        # sha256s already match the served bytes. validate-index.sh
        # walks the full hash chain (root → section → manifest → blob).
        # merged/ is served so manifest relative URLs and blob paths
        # resolve locally; absolute manifest blob URLs point at the
        # configured BLOB_HOST and only get HEAD-checked if reachable.
        run: VALIDATE_INDEX_SH=$PWD/tests/validate-index.sh nix run .#validate-publish-tree -- merged

      - name: Sign index.json (cosign keyless via OIDC)
        # Produces a Sigstore bundle (index.json.sig) alongside index.json.
        # The bundle contains the signature, signing certificate, and Rekor
        # transparency log inclusion proof. The signed bytes are the final
        # bytes — no post-build rewrites between here and rsync.
        run: nix run .#sign-publish-index -- index_tree

      - name: Upload publish-tree artifact
        # Packages both the signed index tree and the blob tree for inspection
        # and future rsync consumption. The artifact mirrors the on-disk layout
        # that the rsync step (below) would push to the origin.
        uses: actions/upload-artifact@v4
        with:
          name: publish-tree
          path: |
            index_tree/
            merged/blobs/
          if-no-files-found: error

      # Push the prepared tree to the cresset-tools/infra origin (CAX11 +
      # Cloud Volume). Three passes per scripts/rsync-publish-tree.sh:
      # blobs first (additive, content-addressed), then the new index
      # tree to /srv/index-versions/<VERSION>/, then atomic symlink flip
      # of /srv/index. Observers never see a half-applied state.
      - name: Rsync to origin
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
        run: nix run .#rsync-publish-tree -- index_tree merged/blobs "$SSH_HOST"
