# Build every supported PHP minor on push and PR. On version tags
# (refs/tags/v*), publish each .tar.zst + .json as a GitHub release asset.
#
# A full clean build of one minor takes ~15 minutes — most of that is the
# 17 C dependencies plus PHP itself plus xdebug. The matrix runs all five
# variants in parallel; FlakeHub Cache shares /nix/store between matrix
# legs and between runs, so the bundled deps are built once and reused
# (PHP and xdebug are the only per-minor recompiles). Cache pushes
# authenticate via the workflow's GitHub OIDC token, which is why this
# job needs `id-token: write`. PR pushes from forks lack the required
# JWT claims; FlakeHub Cache silently downgrades to read-only on those.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-tarball:
    name: build PHP ${{ matrix.php }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # Don't cancel the other minors when one fails — we want to know
      # which version-specific patches need attention, not just the first.
      fail-fast: false
      matrix:
        # Each row carries:
        #   - php / attr: dotted version + underscored flake attribute
        #     (Nix CLI parses dots as attribute path separators, so the
        #     flake exposes `tarball-8_5`, not 8.5).
        #   - os: GitHub-hosted runner image. ubuntu-latest covers x86_64
        #     glibc; macos-14 is the Apple Silicon image (only macOS arch
        #     we ship — Apple is dropping x86_64 in macOS 27).
        #   - target: triple used in the tarball filename. Matches the
        #     value baked into the .json metadata by tarball.nix.
        include:
          - { php: "8.1", attr: "tarball-8_1", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.2", attr: "tarball-8_2", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.3", attr: "tarball-8_3", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.4", attr: "tarball-8_4", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.5", attr: "tarball-8_5", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.1", attr: "tarball-8_1", os: macos-14,      target: "aarch64-apple-darwin" }
          - { php: "8.2", attr: "tarball-8_2", os: macos-14,      target: "aarch64-apple-darwin" }
          - { php: "8.3", attr: "tarball-8_3", os: macos-14,      target: "aarch64-apple-darwin" }
          - { php: "8.4", attr: "tarball-8_4", os: macos-14,      target: "aarch64-apple-darwin" }
          - { php: "8.5", attr: "tarball-8_5", os: macos-14,      target: "aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        # Linux only. The action hangs indefinitely on macos-14 (both
        # `@main` and pinned v3.19.1 reproduced the same stuck-step
        # behavior — `Install Nix` finishes cleanly, then this step
        # never returns). Darwin builds without cache for now; first
        # build will be slow, subsequent macOS builds reuse nothing.
        if: runner.os != 'macOS'
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build the tarball
        run: nix build ".#${{ matrix.attr }}" --print-build-logs

      - name: Smoke-test the artifact
        # Extract to a fresh prefix and verify the basics: PHP runs, the
        # expected version is reported, xdebug dlopens, intl resolves
        # locale data through the bundled ICU, and runtime path resolution
        # tracks the install root after the tree is moved. These gates
        # are version- and platform-agnostic; one inline script handles
        # both Linux and Darwin matrix legs (same tarball layout, same
        # relocation contract — pbs_relocate.h switches on __APPLE__).
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_root"
          tar --use-compress-program=unzstd \
              -xf result/php-*.tar.zst -C "$smoke_root"
          PHP="$smoke_root/install/bin/php"
          echo "::group::php -v"
          "$PHP" -v
          echo "::endgroup::"
          # Cross-check that we built the version this matrix leg expected
          # — defends against a flake change accidentally rerouting an
          # attribute to the wrong source.
          actual=$("$PHP" -r 'echo PHP_MAJOR_VERSION,".",PHP_MINOR_VERSION;')
          if [ "$actual" != "${{ matrix.php }}" ]; then
            echo "FAIL: expected PHP ${{ matrix.php }}, got $actual"; exit 1
          fi
          echo "::group::php -m"
          "$PHP" -m
          echo "::endgroup::"
          echo "::group::expect xdebug loadable"
          "$PHP" -dzend_extension=xdebug -r 'echo "xdebug ", phpversion("xdebug"), "\n";'
          echo "::endgroup::"
          echo "::group::expect intl currency formatting"
          "$PHP" -r 'echo NumberFormatter::create("en_US", NumberFormatter::CURRENCY)->formatCurrency(1234.56, "USD"), "\n";'
          echo "::endgroup::"
          echo "::group::expect relocation tracks the running binary"
          # Linux uses /proc/self/exe, Darwin uses _NSGetExecutablePath —
          # both feed the same pbs_install_root() API in pbs_relocate.h,
          # so the smoke test is identical: move install/, ask php for
          # extension_dir, expect it to track the new prefix.
          mv "$smoke_root/install" "$smoke_root/relocated"
          ext_dir=$("$smoke_root/relocated/bin/php" -r 'echo ini_get("extension_dir");')
          case "$ext_dir" in
            "$smoke_root/relocated/lib/extensions/"*) echo "ok: $ext_dir" ;;
            *) echo "FAIL: extension_dir=$ext_dir did not track relocation"; exit 1 ;;
          esac
          echo "::endgroup::"

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Per-(minor × target) name so the matrix legs don't collide.
          name: php-tarball-${{ matrix.php }}-${{ matrix.target }}
          path: |
            result/php-*.tar.zst
            result/php-*.json
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Each matrix leg appends its own pair of files to the same
          # release, so a tagged release ends up with all five tarballs
          # plus their metadata JSONs.
          files: |
            result/php-*.tar.zst
            result/php-*.json
          fail_on_unmatched_files: true
