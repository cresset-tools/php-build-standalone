# Build every supported PHP minor on push and PR. On version tags
# (refs/tags/v*), the publish job assembles and signs the full
# distribution tree and uploads it as a workflow artifact.
#
# Job graph:
#   build-tarball              — 5-minor × 2-OS matrix; builds tarball-<minor>,
#                                closures-<minor>, extension-xdebug-<minor>,
#                                release-<minor> per leg; uploads artifacts.
#   distro-matrix              — Ubuntu only; runs tests/run-matrix.sh for each
#                                PHP minor against 15 glibc distros + 1 musl
#                                expected-fail (Alpine).
#   assemble                   — 2-OS matrix (ubuntu-latest, macos-26); builds
#                                release-bundle and uploads it per platform.
#   verify-reproducible-index  — runs in parallel with assemble; builds
#                                release-bundle twice and byte-diffs the trees.
#   publish                    — tags only; downloads both release-bundle
#                                artifacts, merges them, validates the tree
#                                locally, substitutes URL placeholders, signs
#                                the root with cosign keyless OIDC, and uploads
#                                the result as the `publish-tree` workflow
#                                artifact. A placeholder rsync step is present
#                                but disabled until the Hetzner box exists.
#
# The actual rsync to the Hetzner origin is deferred (placeholder step,
# currently disabled — see TODO(hetzner) in the publish job). Once
# provisioned, that step consumes the same `publish-tree` artifact shape.
#
# A full clean build of one minor takes ~15 minutes — most of that is the
# 17 C dependencies plus PHP itself plus xdebug. FlakeHub Cache shares
# /nix/store between matrix legs and between runs, so the bundled deps
# are built once and reused (PHP and xdebug are the only per-minor
# recompiles). Cache pushes authenticate via the workflow's GitHub OIDC
# token, which is why jobs need `id-token: write`. PR pushes from forks
# lack the required JWT claims; FlakeHub Cache silently downgrades to
# read-only on those.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded pushes on PR branches. Never cancel main — a tag push
# mid-release would otherwise leave a half-uploaded GH Release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-tarball:
    name: build PHP ${{ matrix.php }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      # Don't cancel the other minors when one fails — we want to know
      # which version-specific patches need attention, not just the first.
      fail-fast: false
      matrix:
        # Each row carries:
        #   - php / minor: dotted version + underscored flake attribute suffix
        #     (Nix CLI parses dots as attribute path separators, so the
        #     flake exposes `tarball-8_5`, not 8.5).
        #   - os: GitHub-hosted runner image. ubuntu-latest covers x86_64
        #     glibc; macos-26 (Tahoe) is the current Apple Silicon image
        #     (only macOS arch we ship — Apple dropped x86_64 in macOS 27).
        #   - target: triple used in the tarball filename. Matches the
        #     value baked into the .json metadata by tarball.nix.
        include:
          - { php: "8.1", minor: "8_1", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.2", minor: "8_2", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.3", minor: "8_3", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.4", minor: "8_4", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.5", minor: "8_5", os: ubuntu-latest, target: "x86_64-unknown-linux-gnu" }
          - { php: "8.1", minor: "8_1", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.2", minor: "8_2", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.3", minor: "8_3", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.4", minor: "8_4", os: macos-26,      target: "aarch64-apple-darwin" }
          - { php: "8.5", minor: "8_5", os: macos-26,      target: "aarch64-apple-darwin" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build tarball
        # Each nix build uses its own -o symlink so subsequent builds
        # don't clobber prior results — the upload steps below need
        # both the interpreter tarball and the release tree to coexist.
        run: nix build ".#tarball-${{ matrix.minor }}" -o result-tarball --print-build-logs

      - name: Smoke-test the artifact
        # Extract to a fresh prefix and verify the basics: PHP runs, the
        # expected version is reported, intl resolves locale data through
        # the bundled ICU, and runtime path resolution tracks the install
        # root after the tree is moved. xdebug is NOT checked here —
        # Phase 3 ships xdebug as a separate per-extension tarball; the
        # distro-matrix job covers xdebug end-to-end via tests/smoke.sh.
        # These gates are version- and platform-agnostic; one inline
        # script handles both Linux and Darwin matrix legs (same tarball
        # layout, same relocation contract — pbs_relocate.h switches on
        # __APPLE__).
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_root"
          tar --use-compress-program=unzstd \
              -xf result-tarball/php-*.tar.zst -C "$smoke_root"
          PHP="$smoke_root/install/bin/php"
          echo "::group::php -v"
          "$PHP" -v
          echo "::endgroup::"
          # Cross-check that we built the version this matrix leg expected
          # — defends against a flake change accidentally rerouting an
          # attribute to the wrong source.
          actual=$("$PHP" -r 'echo PHP_MAJOR_VERSION,".",PHP_MINOR_VERSION;')
          if [ "$actual" != "${{ matrix.php }}" ]; then
            echo "FAIL: expected PHP ${{ matrix.php }}, got $actual"; exit 1
          fi
          echo "::group::php -m"
          "$PHP" -m
          echo "::endgroup::"
          echo "::group::expect intl currency formatting"
          "$PHP" -r 'echo NumberFormatter::create("en_US", NumberFormatter::CURRENCY)->formatCurrency(1234.56, "USD"), "\n";'
          echo "::endgroup::"
          echo "::group::expect relocation tracks the running binary"
          # Linux uses /proc/self/exe, Darwin uses _NSGetExecutablePath —
          # both feed the same pbs_install_root() API in pbs_relocate.h,
          # so the smoke test is identical: move install/, ask php for
          # extension_dir, expect it to track the new prefix. (This also
          # incidentally checks the tarball ships writable directories,
          # since macOS rename(2) refuses 0555 source dirs.)
          mv "$smoke_root/install" "$smoke_root/relocated"
          ext_dir=$("$smoke_root/relocated/bin/php" -r 'echo ini_get("extension_dir");')
          case "$ext_dir" in
            "$smoke_root/relocated/lib/extensions/"*) echo "ok: $ext_dir" ;;
            *) echo "FAIL: extension_dir=$ext_dir did not track relocation"; exit 1 ;;
          esac
          echo "::endgroup::"

      - name: Build closures
        run: nix build ".#closures-${{ matrix.minor }}" -o result-closures --print-build-logs

      - name: Build extension-xdebug
        run: nix build ".#extension-xdebug-${{ matrix.minor }}" -o result-extension --print-build-logs

      - name: Build release
        run: nix build ".#release-${{ matrix.minor }}" -o result-release --print-build-logs

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Per-(minor × target) name so the matrix legs don't collide.
          name: php-tarball-${{ matrix.php }}-${{ matrix.target }}
          path: |
            result-tarball/php-*.tar.zst
            result-tarball/php-*.json
          if-no-files-found: error

      - name: Upload release tree as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Uploaded separately from the tarball so the assemble job can
          # grab all five minors' release trees without needing the raw
          # interpreter tarballs again.
          name: release-${{ matrix.php }}-${{ matrix.target }}
          path: result-release/
          if-no-files-found: error

  distro-matrix:
    name: distro matrix PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: php-tarball-${{ matrix.php }}-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Run distro matrix
        run: |
          tarball=$(find artifacts -name 'php-*.tar.zst' | head -n1)
          PHP_TARBALL="$tarball" tests/run-matrix.sh

  assemble:
    name: assemble release-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: linux }
          - { os: macos-26,      artifact: darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build release-bundle
        # FlakeHub Cache hits all per-minor inputs already built in
        # build-tarball, so this is fast on a warm cache.
        run: nix build .#release-bundle --print-build-logs

      - name: Upload release-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.artifact }}
          path: result/
          if-no-files-found: error

  # Phase 9 — Reproducibility audit.
  # Runs in parallel with assemble (needs only build-tarball). Builds
  # release-bundle twice using --rebuild so Nix re-derives the same
  # derivation and rejects it if the output bytes differ. The diff is a
  # belt-and-braces check on top of Nix's content-addressed store.
  verify-reproducible-index:
    name: reproducibility audit
    runs-on: ubuntu-latest
    needs: [build-tarball]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3.19.1

      - name: Build release-bundle (first pass)
        run: nix build .#release-bundle -o result-1 --print-build-logs

      - name: Build release-bundle (second pass — --rebuild)
        # --rebuild re-derives the derivation from scratch. Nix checks that
        # the new output is content-equal to the already-stored one; if not,
        # it fails here with "hash mismatch in fixed-output derivation".
        run: nix build .#release-bundle --rebuild -o result-2 --print-build-logs

      - name: Byte-diff the two outputs
        run: diff -r result-1/ result-2/

  # Phase 5 + 7 — Root signing and publish tree preparation.
  #
  # Merges the Linux and Darwin release-bundle trees into one unified
  # distribution tree, then:
  #   1. Validates the tree locally (before any substitution) against a
  #      localhost http.server so the sha256 chain is verified without
  #      needing the real hostnames to resolve.
  #   2. Substitutes {INDEX_BASE} and {BLOB_BASE} placeholders in all
  #      *.json files using the configured host vars.
  #   3. Signs index.json with cosign keyless (Sigstore OIDC), producing
  #      index.json.sig as a Sigstore bundle file.
  #   4. Uploads the final tree as the `publish-tree` workflow artifact.
  #   5. (Placeholder, currently disabled) rsyncs to the Hetzner origin.
  publish:
    name: prepare publish tree
    runs-on: ubuntu-latest
    needs: [build-tarball, distro-matrix, assemble]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read   # no Pages/Releases push
      id-token: write  # cosign keyless OIDC
    env:
      INDEX_HOST: ${{ vars.INDEX_HOST || 'index.example.com' }}
      BLOB_HOST:  ${{ vars.BLOB_HOST  || 'blobs.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download Linux release-bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-linux
          path: bundles/linux/

      - name: Download Darwin release-bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-darwin
          path: bundles/darwin/

      - name: Merge Linux + Darwin trees
        # Both bundles share the same index.json schema and generated timestamp
        # (SOURCE_DATE_EPOCH is fixed in index.nix) but have disjoint
        # targets/<triple> subtrees. The merge is:
        #   - Union targets/ directories (no conflicts — target triples differ)
        #   - Union blobs/ directories (content-addressed; collisions are fine)
        #   - Deep-merge the two index.json roots: same schema/generated,
        #     .targets maps are disjoint so they can be merged with jq.
        run: |
          set -euo pipefail
          mkdir -p merged/blobs

          # Copy Linux tree first
          cp -r bundles/linux/. merged/

          # Merge Darwin targets/ (disjoint triples, no overwrite)
          if [ -d bundles/darwin/targets ]; then
            cp -rn bundles/darwin/targets/. merged/targets/
          fi

          # Merge Darwin blobs/ (content-addressed; --no-clobber is safe)
          if [ -d bundles/darwin/blobs ]; then
            cp -rn bundles/darwin/blobs/. merged/blobs/ 2>/dev/null || true
          fi

          # Merge the two index.json roots: deep-merge .targets maps.
          # Both have identical schema and generated values (deterministic build).
          jq -s '
            .[0] as $linux | .[1] as $darwin |
            $linux | .targets = ($linux.targets + $darwin.targets)
          ' bundles/linux/index.json bundles/darwin/index.json > merged/index.json

          echo "Merged tree:"
          echo "  targets: $(jq '.targets | keys | length' merged/index.json)"
          echo "  blobs:   $(find merged/blobs -type f 2>/dev/null | wc -l)"

      - name: Split into index tree and blob tree
        run: |
          set -euo pipefail
          # index_tree/ gets everything except blobs/.
          rsync -a --exclude='blobs/' merged/ index_tree/
          echo "Index tree files: $(find index_tree -type f | wc -l)"

      - name: Validate tree locally (pre-substitution)
        # Validation runs against the unsubstituted tree, where blob URLs still
        # contain {BLOB_BASE}. validate-index.sh already skips HEAD checks for
        # unsubstituted {BLOB_BASE} URLs (see its "warning: unsubstituted"
        # guard). The structural checks — root schema, section sha256 chain,
        # manifest sha256 chain — are all meaningful here because substitution
        # doesn't touch those hashes.
        #
        # We serve merged/ (which contains both index_tree files and blobs/)
        # so that manifest relative URLs and blob paths all resolve locally.
        # A fixed port (8765) is used; killed with pkill after the check.
        run: |
          set -euo pipefail
          PORT=8765
          python3 -m http.server "$PORT" --directory merged &
          HTTP_PID=$!
          # Give the server a moment to bind
          sleep 1
          set +e
          bash tests/validate-index.sh "http://127.0.0.1:${PORT}"
          EXIT_CODE=$?
          set -e
          kill "$HTTP_PID" 2>/dev/null || true
          exit $EXIT_CODE

      - name: Substitute URL placeholders
        # Two sed passes: one for {INDEX_BASE}, one for {BLOB_BASE}.
        # The blob URL pattern is {BLOB_BASE}/blobs/<XX>/<HASH> and maps to
        # https://$BLOB_HOST/blobs/<XX>/<HASH> — a simple host substitution,
        # no per-shard rewriting needed.
        # Signing happens after this step, so the signed bytes are final.
        run: |
          set -euo pipefail
          INDEX_BASE="https://${INDEX_HOST}"
          BLOB_BASE="https://${BLOB_HOST}"

          find index_tree -name '*.json' -exec \
            sed -i "s|{INDEX_BASE}|${INDEX_BASE}|g" {} +
          find index_tree -name '*.json' -exec \
            sed -i "s|{BLOB_BASE}|${BLOB_BASE}|g" {} +

          echo "URL substitution complete"
          grep -r '{INDEX_BASE}\|{BLOB_BASE}' index_tree/ && \
            { echo "FAIL: unsubstituted placeholders remain"; exit 1; } || true

      - name: Sign index.json (cosign keyless via OIDC)
        # Produces a Sigstore bundle (index.json.sig) alongside index.json.
        # The bundle contains the signature, signing certificate, and
        # Rekor transparency log inclusion proof. The CLI verifies this
        # bundle using the GitHub Actions OIDC issuer + the workflow identity.
        # Signing happens AFTER all substitutions so the signed bytes are final.
        run: |
          cosign sign-blob --yes \
            --bundle index_tree/index.json.sig \
            index_tree/index.json

      - name: Upload publish-tree artifact
        # Packages both the signed index tree and the blob tree for inspection
        # and future rsync consumption. The artifact mirrors the on-disk layout
        # that the rsync step (below) would push to the origin.
        uses: actions/upload-artifact@v4
        with:
          name: publish-tree
          path: |
            index_tree/
            merged/blobs/
          if-no-files-found: error

      # TODO(hetzner): enable this step once the origin server is provisioned.
      # Two rsync invocations match the two-vhost layout described in
      # DISTRIBUTION.md "Hosting": one for the index tree → index.example.com,
      # one for blobs → blobs.example.com. Index.json is rsynced last so
      # observers never see a root that references a section file that hasn't
      # landed yet (atomic-ish ordering at the file level).
      #
      # Prerequisites before enabling:
      #   - Hetzner box provisioned, nginx vhosts configured
      #   - SSH key added to secrets.PUBLISH_SSH_KEY
      #   - $INDEX_HOST and $BLOB_HOST vars set to real hostnames
      #   - Runner's public key authorised on the box
      - name: Rsync to Hetzner origin (placeholder — not yet enabled)
        if: false  # TODO(hetzner): remove this guard when the box exists
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$PUBLISH_SSH_KEY" > ~/.ssh/publish_key
          chmod 600 ~/.ssh/publish_key
          SSH_OPTS="-i ~/.ssh/publish_key -o StrictHostKeyChecking=no"

          # 1. Push everything in the index tree EXCEPT index.json first,
          #    so sections and manifests are in place before the root updates.
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            --exclude='index.json' \
            index_tree/ \
            deploy@${INDEX_HOST}:/srv/index/

          # 2. Push blobs (content-addressed; existing files are no-ops).
          rsync -az \
            -e "ssh $SSH_OPTS" \
            merged/blobs/ \
            deploy@${BLOB_HOST}:/srv/blobs/

          # 3. Push index.json last — atomic-ish: root now points at sections
          #    that are already present on disk.
          rsync -az \
            -e "ssh $SSH_OPTS" \
            index_tree/index.json \
            index_tree/index.json.sig \
            deploy@${INDEX_HOST}:/srv/index/
